modId="totallywaifu"
version="7.0.0"
displayName="Totally Waifu?"
authors="Totally Waifu"
logoFile="logo.png"
credits="Hecho con ♥ para quienes quieren que su mundo tenga más vida."
description='''
§d♥ Totally Waifu? ♥§r — ¿Y si los bloques y las criaturas de Minecraft fueran chicas?

Al empezar un mundo, un misterioso ente de luz (§e???§r) te entrega la §dVara de Transformación§r... y caes del cielo con una explosión.

§6✦ MESAS QUE COBRAN VIDA (reversibles)§r
Usa la vara sobre una mesa de crafteo, horno, cofre, mesa de encantamientos, cama, yunque, afiladora, telar, cortapiedras, mesa de herrería, mesa de cartografía, ahumador o alto horno: se convierte en una chica que abre su menú, trabaja para ti y vuelve a ser bloque cuando quieras (con todas sus cosas).
Kozue fabrica cualquier objeto, Homura/Kemuri/Rekka cocinan solo lo que pidas, Kura guarda y ordena, Shiori encanta, Yume te deja dormir en sus piernas y cuida tus sueños, Kana repara tu equipo, Carta encuentra aldeas...

§a✦ ANIMALES Y MONSTRUOS (para siempre)§r
Ovejas, vacas, lobos, gatos, gólems, aldeanos, zombis, creepers, endermans, blazes, ghasts, piglins, el Warden ¡y más! Cada una con aspecto propio y sus habilidades: Luna caza por ti, Brisa se deja montar, Dina y Mita lanzan explosivos, Umbra es tu guardiana definitiva.

§b✦ COLECCIÓN ♥ Mis Waifus (tecla K)§r
Llama, guarda y sigue a todas tus chicas. Complétala para ganar recompensas, la Bendición ♥ y desbloquear 12 waifus EXTRA. ¡Complétalas también para la Bendición ✦ y tesoros legendarios!

§6☀ LEYENDAS§r
Al completar los extras despiertan 8 waifus LEYENDA: burro, cabra, llama (con poncho y chullo), camello (¡se monta!), sniffer, calamar brillante, evocadora y murciélago.

§e✦ LA DIOSA ZORRO BLANCA§r
Encuéntralas a todas y te volverás intangible, subirás más allá de las nubes... y el ente de luz te dirá: "No pensé que lograrías encontrarlas a todas". Te confiará a §eInari§r: educada, tranquila y juguetona, con un círculo dorado de divinidad en la espalda. Se convierte en un §ezorro dios gigante§r que vuela y corre por los cielos (¡puedes montarla!), embiste destruyendo lo que se interponga, y §enunca deja que nadie te lastime§r. Órdenes: §e/inari zorro · chica · montar · llamar§r o la tecla §eV§r.

§c♥ Ninguna waifu puede morir§r, sus flechas, explosiones y hechizos nunca te lastiman, y tu vara nunca se pierde al morir.
'''

