name: Compilar TannyMaid (.jar)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar el mod
        run: |
          DIR=$(dirname "$(find . -maxdepth 3 -name gradlew | head -1)")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace

      - name: Guardar el .jar
        uses: actions/upload-artifact@v4
        with:
          name: TannyMaid-jar
          path: |
            **/build/libs/*.jar
            !**/build/libs/*-sources.jar
